
name: Compilar APK ITA Mobilidade

on:
  workflow_dispatch:
  push:
    paths:
      - "ita-mobilidade.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      
        
              - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          
          
          

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q ita-mobilidade.zip -d extracted

          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "ERRO: arquivo gradlew nao encontrado no ZIP."
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ITA-Mobilidade-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
